<!DOCTYPE html>
<html>
<head>
	<title>1</title>
	<style type="text/css">
		*{
			box-sizing:border-box;
			margin:0px;
		}
		.box1{
			height:100px;
			width:100px;
			background-color:red;
			animation-name:box1;
			animation-duration:5s;
			position:absolute;
			border-radius:50%;
			animation-iteration-count:infinite;
		}
		@keyframes box1{
			0%{
				background-color:red;
				top:0%;
				left:0%;
			}
			25%{
				background-color:green;
				top:0%;
				left:94%;
			}
			50%{
				background-color:blue;
				top:89%;
				left:94%;
			}
			75%{
				background-color:yellow;
				top:89%;
				left:0%;
			}
			100%{
				background-color:pink;
				top:0%;
				left:0%;
			}
		}

	</style>
</head>
<body>
	<div class="box1"></div>
</body>
</html>
