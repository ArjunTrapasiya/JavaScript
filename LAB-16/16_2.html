<!-- 2. Write a program to demonstrate the use of various array methods such as includes() and find() in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Array Method Includes & Find</title>
</head>
<body>
	<h1 id="x"></h1>
</body>
<script>
	var names=['Arjun','Dushyant','Prince'];
	var result1=names.includes("Prince");
	var result2=names.includes("Dhairya");
	var a=[10,20,26,40,50];

	console.log(result1);
	console.log(result2);

	document.getElementById('x').innerHTML=a.find(check);

	function check(mark)
	{
		return mark>25;
	}
</script>
</html>
