<!-- 1. Write a program to demonstrate the use of various array methods such as join() and split() in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Array Method Join & Split</title>
</head>
<body>
</body>
<script>
	var ary=[10,20,30,40,50];
	console.log(ary.join());
	console.log(ary.join("-"));
	console.log(ary.join("|"));

	var fruits = "apple,banana,orange";
	var fruitAry = fruits.split(",");

	console.log(fruitAry);

</script>
</html>
