<!-- 1. Write a program to demonstrate some function of ES6. -->

<!DOCTYPE html>
<html>
<head>
	<title>Some Function</title>
</head>
<body>
	<script>
		var num=[1,2,3,4,5];
		var EvenNum=num.some(num=> num % 2 == 0); 
		var OddNum=num.every(num=> num % 2 == 0);
		console.log("Some = "+EvenNum);
		console.log("Every = "+OddNum);

	</script>
</body>
</html>
