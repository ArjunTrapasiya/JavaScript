<!-- 2. Write a program to demonstrate the filter() function of ES6. -->

<!DOCTYPE html>
<html>
<head>
	<title>Filter Function</title>
</head>
<body>
	<script>
		var Student= [
			{Name: 'Naruto' , age:'22'},
			{Name: 'Kakashi' , age:'32'},
			{Name: 'Jiraya' , age:'55'},
			{Name: 'Sasuke' , age:'21'}
		];

		var std = Student.filter(function (std) {
			return std.age>30;
		});

		console.log(std);
	</script>
</body>
</html>
