<!-- 4. Write a program to demonstrate the map() function of ES6. -->

<!DOCTYPE html>
<html>
<head>
	<title>Map Function</title>
</head>
<body>	
	<script>
		var names=['team - 7','naruto','sasuke','sakura','kakashi'];
		var Tname=names.map(function (names){
			return names.toUpperCase();
		});
		console.log(Tname);
	</script>
</body>
</html>
