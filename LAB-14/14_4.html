<!-- 4. Write a program to demonstrate arrow functions with only one argument in JavaScript.  -->

<!DOCTYPE html>
<html>
<head>
	<title>Arrow Function With One Argument</title>
</head>
<body>

	<script>
		
		var add = (a) => a + a;
		{
			document.write("Addition : " + add (17));
		}

	</script>

</body>
</html>
