<!-- 3. Write a program to demonstrate the concept of arrow functions in JavaScript.  -->
<!DOCTYPE html>
<html>
<head>
	<title>Arrow Function</title>
</head>
<body>

	<script type="text/javascript">
		
		var add = (a,b) => a+b

		{
			document.write("addition Of Number :");
			document.write(add(10,70));
		}

	</script>

</body>
</html>
