<!-- Write a program to demonstrate changing the properties of an HTML element using JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Changing the Properties of an HTML Element using JavaScript</title>
</head>
<body>
	<h1 id="h1" style="font-family:sans-serif; color: green;">Hello How Are You ?</h1>
	<button onclick="change()">Change Style</button>
</body>
<script>
		function change()
		{
		    var a=document.getElementById("h1");

		    a.style.color="white";
		    a.style.backgroundColor="red";
		    a.style.fontSize="50px";
		    a.style.fontWeight="bolder";
		    a.style.fontFamily="Cursive";
		}
</script>
</html>
