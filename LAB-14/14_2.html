<!-- 2. Demonstrate the difference between let, var, and const in JavaScript.  -->

<!DOCTYPE html>
<html>
<head>
	<title>Difference between let, var, and const</title>
</head>
<body>

	<script type="text/javascript">
		
		var a=10;

		if(true)
		{
			var a=20;
			console.log("inside",a);
		}

		console.log("outside",a);

		let b=30;

		if(true)
		{
			b=40;
			console.log("inside",b);
		}

		console.log("outside",b);

		const c=50;

		if(true)
		{
			c=40;
			console.log("inside",c);
		}

		console.log("outside",c);

	</script>

</body>
</html>
