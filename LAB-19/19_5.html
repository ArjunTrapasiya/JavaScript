<!--5.Write a program to demonstrate the spread operator in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Spread Operator</title>
</head>
<body>
	<script>
		var Department = ["BCA","BBA","B.Tech"];
		var Name = ["Naruto" , "Kakashi" , "Jiraya"];

		var add = [...Department , ...Name];

		console.log("Department: ",Department);
		console.log("Name: ",Name);
		console.log("Add Both: ",add);

	</script>
</body>
</html>
