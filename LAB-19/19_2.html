<!-- 2.Write a program to demonstrate the use of array destructuring in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Array Destructuring</title>
</head>
<body>
	<script>
		var fruits=["Apple","Watermalon","Banana","Pineapple"];

		var [f1 , f2 , f3 , f4] = fruits;

		console.log("Fruits 1: ",f1);
		console.log("Fruits 2: ",f2);
		console.log("Fruits 3: ",f3);
		console.log("Fruits 4: ",f4);

	</script>
</body>
</html>
