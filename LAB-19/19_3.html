<!-- 3 & 4.Write a program to demonstrate the use of the Import & export module in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Import - Export Module</title>
</head>
<body>
	<script type="Module">

		import { Add, Multiply } from "./19_3.js";

		console.log("Addition:", Add(10, 7));
		console.log("Multiplication:", Multiply(10, 5));

	</script>
</body>
</html>
