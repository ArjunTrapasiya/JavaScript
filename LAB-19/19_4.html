<!-- 4.Write a program to combine two numerical arrays using the spread operator in JavaScript..-->

<!DOCTYPE html>
<html>
<head>
	<title>Spread Operator using Array</title>
</head>
<body>
	<script>

		let numbers1 = [10, 20, 30];
		let numbers2 = [40, 50, 60];

		let numbers = [...numbers1 , ...numbers2];

		console.log("Array 1:", numbers1);
		console.log("Array 2:", numbers2);
		console.log("Combined Array:", numbers);
	</script>
</body>
</html>
