<!-- Write a program to check whether a given number is a palindrome or not using an arrow function in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
	<title>Palindrome Using Arrow Function</title>
</head>
<body>
</body>
<script>
	var n=parseInt(prompt("Enter The Number: "));

	var palindrome=(n)=>{

		var org=n;
		var rev =0;
		while(n!=0)
		{
			rem=n%10;
			rev=rev*10+rem;
			n=Math.floor(n/10);
		}

		if(org==rev)
		{
			return true;
		}
		else
			return false;
	}

	console.log(palindrome(n));
</script>
</html>
