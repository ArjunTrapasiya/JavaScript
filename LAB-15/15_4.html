<!-- 4. Write a program to demonstrate multiple arrow functions in JavaScript.-->

<!DOCTYPE html>
<html>
<head>
	<title>Multiple Arrow Function</title>
</head>
<body>
</body>
<script>
	
	var add=(a,b)=>a+b;
	console.log(add(15,2));
	
	var sub=(a,b)=>a-b;
	console.log(sub(15,2));

	var mul=(a,b)=>a*b;
	console.log(mul(15,2));

	var div=(a,b)=>a/b;
	console.log(div(15,2));

	var mod=(a,b)=>a%b;
	console.log(mod(15,2));

</script>
</html>
